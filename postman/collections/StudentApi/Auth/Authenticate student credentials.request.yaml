$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "email": "pritam@example.com",
      "password": "Password@123"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "minLength": 1,
          "example": "pritam@example.com",
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 1,
          "example": "Password@123"
        }
      },
      "required": [
        "email",
        "password"
      ]
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Authenticate student credentials.resources/examples
order: 5000
