# ==============================================================================
# Production Profile (Activated with SPRING_PROFILES_ACTIVE=prod)
# ==============================================================================

# Database Safety Guard (strictly validate schema; never auto-alter in production)
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging to stdout (maximizes I/O performance and prevents log leakage)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.output.ansi.enabled=NEVER

# Disable JSON indentation to save network bandwidth and minimize payload sizes
spring.jackson.serialization.indent-output=false

# Production Logging (INFO level to optimize storage and throughput)
logging.level.root=INFO
logging.level.com.maityp394.studentapi=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF
logging.level.org.hibernate.orm.connections.pooling=WARN

# Production Security (Enforce HTTPS cookies and configured CORS origins)
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
