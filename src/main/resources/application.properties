spring.application.name=studentapi
server.port=${PORT:8000}

# Neon PostgreSQL connection
spring.datasource.url=${DATABASE_URL:}

# HikariCP Connection Pool (Optimized for Neon Serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1204000
spring.datasource.hikari.connection-timeout=20400
spring.datasource.hikari.pool-name=StudentApiHikariPool

# JPA Base Settings
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RFC 9457 Problem Details
spring.mvc.problemdetails.enabled=true

# Actuator — expose only safe endpoints
management.endpoints.web.exposure.include=health,info

# JWT (secret is required; defaults for issuer and expiration are declared in JwtProperties)
jwt.secret=${JWT_SECRET:}

# Logging baseline
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF

# Flyway migration logging
logging.level.org.flywaydb=INFO

# Suppress Hibernate database info dump to prevent leaking raw connection string and credentials
logging.level.org.hibernate.orm.connections.pooling=WARN

# Redis Connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Spring Cache Redis Configuration
spring.cache.type=redis
spring.cache.cache-names=student-profile
spring.cache.redis.time-to-live=15m
spring.cache.redis.cache-null-values=false
spring.cache.redis.enable-statistics=true

# Application Cache Properties
app.cache.time-to-live=${spring.cache.redis.time-to-live:15m}

# OpenAPI Configuration
app.openapi.anonymous-paths=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/logout,/api/v1/auth/refresh

# Pagination Configuration
spring.data.web.pageable.max-page-size=50

# Spring Security OAuth2 Client - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend Redirect URIs after OAuth
app.security.oauth2.authorized-redirect-uri=${FRONTEND_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/callback}
app.security.oauth2.failure-redirect-uri=${FRONTEND_FAILURE_REDIRECT_URI:http://localhost:3000/login?error=oauth_failed}

# Redis OAuth State TTL
app.security.session.oauth-state-ttl-seconds=300


