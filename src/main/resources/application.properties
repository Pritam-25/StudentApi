spring.application.name=studentapi
server.port=8000

# Neon PostgreSQL connection
spring.datasource.url=${DATABASE_URL}

# HikariCP Connection Pool (Optimized for Neon Serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=StudentApiHikariPool

# JPA config (Dialect auto-detected by Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.output.ansi.enabled=ALWAYS
spring.jackson.serialization.indent-output=true
logging.level.root=INFO
logging.level.com.maityp394.studentapi=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF
spring.mvc.problemdetails.enabled=true

# JWT (secret is required; defaults for issuer and expiration are declared in JwtProperties)
jwt.secret=${JWT_SECRET:}

# Cookie Security (false for local dev, true for production HTTPS)
app.security.cookie.secure=${COOKIE_SECURE:false}

# Actuator — expose only safe endpoints
management.endpoints.web.exposure.include=health,info

# Dev-only settings (override in dev profile or via env variable)
spring.jpa.show-sql=${SHOW_SQL:false}