spring.application.name=studentapi
server.port=${PORT:8000}

# Neon PostgreSQL connection
spring.datasource.url=${DATABASE_URL:}

# HikariCP Connection Pool (Optimized for Neon Serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=StudentApiHikariPool

# JPA Base Settings
spring.jpa.open-in-view=false

# RFC 9457 Problem Details
spring.mvc.problemdetails.enabled=true

# Actuator — expose only safe endpoints
management.endpoints.web.exposure.include=health,info

# JWT (secret is required; defaults for issuer and expiration are declared in JwtProperties)
jwt.secret=${JWT_SECRET:}

# Logging baseline
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF

# Suppress Hibernate database info dump to prevent leaking raw connection string and credentials
logging.level.org.hibernate.orm.connections.pooling=WARN