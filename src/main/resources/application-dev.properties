# ==============================================================================
# Development Profile (Activate locally via SPRING_PROFILES_ACTIVE=dev)
# ==============================================================================

# Database DDL (auto-update tables during development)
spring.jpa.hibernate.ddl-auto=update

# SQL Logging & Formatting (visible in development console)
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.output.ansi.enabled=ALWAYS

# JSON Pretty-Printing for human-friendly API inspection
spring.jackson.serialization.indent-output=true

# Logging Level
logging.level.root=INFO
logging.level.com.maityp394.studentapi=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF

# Security (HTTP allowed locally, Next.js default port 3000)
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator — expose caches & metrics in dev for cache diagnostics & observability
management.endpoints.web.exposure.include=health,info,caches,metrics

# Spring Cache TRACE logging for local development & debugging
logging.level.org.springframework.cache=TRACE
