spring.application.name=studentapi-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway in test profile to isolate H2 in-memory schema generation
spring.flyway.enabled=false

# JWT Test Config
jwt.secret=kmytnY22MFC0rrbZQYhFfj54fUueup4YcgYRDQfCDv0=
jwt.expiration-ms=900000
app.security.cookie.secure=false

# Logging configuration for tests
spring.output.ansi.enabled=always
logging.level.root=INFO
logging.level.com.maityp394.studentapi=DEBUG
logging.level.org.springframework.test.context.cache=INFO
logging.level.org.springframework.test.context.support=WARN
logging.level.org.springframework.context.annotation.AnnotationConfigApplicationContext=ERROR
