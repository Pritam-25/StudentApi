services:
  redis:
    image: redis:7-alpine
    container_name: studentapi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: >
        redis-cli -a "$$REDIS_PASSWORD" ping
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
    driver: local